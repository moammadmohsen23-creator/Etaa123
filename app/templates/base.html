<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}پنل مدیریت{% endblock %}</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#1c2333;--mut:#6b7385;--pri:#2563eb;--ok:#16a34a;--bad:#dc2626;--line:#e4e8f1}
@media (prefers-color-scheme:dark){:root{--bg:#0f1420;--card:#171e2e;--ink:#e8ecf5;--mut:#98a2b8;--line:#263049}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,sans-serif;line-height:1.8}
nav{background:var(--card);border-bottom:1px solid var(--line);padding:0 16px;display:flex;gap:4px;align-items:center;flex-wrap:wrap;position:sticky;top:0}
nav b{margin-inline-end:12px;padding:12px 0}
nav a{padding:12px 12px;color:var(--mut);text-decoration:none;border-bottom:3px solid transparent}
nav a.on{color:var(--pri);border-color:var(--pri);font-weight:600}
nav form{margin-inline-start:auto}
main{max-width:1000px;margin:24px auto;padding:0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
h1{font-size:20px;margin:0 0 16px}h2{font-size:16px;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.stat span{display:block;color:var(--mut);font-size:13px}.stat b{font-size:26px}
label{display:block;margin:12px 0 4px;font-weight:600;font-size:14px}
small{color:var(--mut)}
input,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
input[dir=ltr],textarea[dir=ltr]{text-align:left}
button,.btn{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:9px 16px;font:inherit;cursor:pointer;text-decoration:none;display:inline-block}
button.ghost{background:transparent;color:var(--mut);border:1px solid var(--line)}
button.bad{background:var(--bad)}button.ok{background:var(--ok)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:start;vertical-align:middle}
th{color:var(--mut);font-weight:600}
.tbl{overflow-x:auto}
.flash{background:#e0ecff;color:#123;border-radius:10px;padding:10px 14px;margin-bottom:16px}
.pill{padding:2px 10px;border-radius:99px;font-size:12px;background:var(--line)}
.pill.ok{background:#dcfce7;color:#166534}.pill.bad{background:#fee2e2;color:#991b1b}.pill.warn{background:#fef3c7;color:#92400e}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row input{width:90px}
</style>
</head>
<body>
{% if page != 'login' %}
<nav>
  <b>🤖 پنل ربات ایتایار</b>
  <a href="/" class="{{ 'on' if page=='dashboard' }}">داشبورد</a>
  <a href="/settings" class="{{ 'on' if page=='settings' }}">تنظیمات</a>
  <a href="/users" class="{{ 'on' if page=='users' }}">کاربران</a>
  <a href="/payments" class="{{ 'on' if page=='payments' }}">پرداخت‌ها</a>
  <form method="post" action="/logout"><button class="ghost">خروج</button></form>
</nav>
{% endif %}
<main>
{% if flash %}<div class="flash">{{ flash }}</div>{% endif %}
{% block body %}{% endblock %}
</main>
</body>
</html>
